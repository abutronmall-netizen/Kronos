name: offline-kronos-source

on:
  push:
    branches: ["abutron/v2.40.4-kv-cache"]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release metadata
        run: |
          echo "${GITHUB_SHA}" > RELEASE_COMMIT.txt
          echo "Abutron Kronos model/source v2.40.4 KV-cache branch" > RELEASE_NAME.txt
      - name: Upload full source tree
        uses: actions/upload-artifact@v4
        with:
          name: Abutron-Kronos-Model-Source-v2.40.4
          path: |
            .
            !.git
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
